<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Ads Brief Generator — The100x.digital</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f4f0;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 2rem;
  }

  header h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  header p {
    font-size: 14px;
    color: #666;
    margin-top: 4px;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e8e6e0;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #888;
    margin-bottom: 12px;
  }

  .fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 0;
  }

  label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 6px;
    font-weight: 500;
  }

  select, input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    color: #1a1a1a;
    background: #fff;
    appearance: none;
    -webkit-appearance: none;
    outline: none;
    transition: border-color 0.15s;
  }

  select:focus, input[type="text"]:focus {
    border-color: #1a1a1a;
  }

  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #666;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-green { background: #639922; }
  .dot-amber { background: #EF9F27; }

  .angles {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .angle-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    font-size: 12px;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: transparent;
    color: #555;
    cursor: pointer;
    transition: all 0.15s;
  }

  .angle-btn:hover { border-color: #999; color: #1a1a1a; }

  .angle-btn.active {
    background: #1a1a1a;
    color: #fff;
    border-color: #1a1a1a;
  }

  .gen-btn {
    width: 100%;
    padding: 12px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 1.25rem;
  }

  .gen-btn:hover { background: #333; }
  .gen-btn:disabled { background: #999; cursor: not-allowed; }

  .error {
    background: #fff0f0;
    border: 1px solid #fdd;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: #c00;
    margin-top: 12px;
    display: none;
  }

  .loading {
    text-align: center;
    padding: 2rem;
    color: #888;
    font-size: 14px;
    display: none;
  }

  .result { display: none; }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
    gap: 10px;
  }

  .result-meta h2 {
    font-size: 16px;
    font-weight: 600;
  }

  .result-meta p {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
  }

  .client-tag {
    font-size: 12px;
    background: #f5f4f0;
    padding: 4px 10px;
    border-radius: 6px;
    color: #666;
  }

  .fmt-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .fmt-tab {
    padding: 5px 14px;
    font-size: 12px;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: transparent;
    color: #666;
    cursor: pointer;
    transition: all 0.15s;
  }

  .fmt-tab.active {
    background: #e8f0fe;
    color: #1a56db;
    border-color: #c3d7ff;
  }

  .brief-block {
    background: #f9f8f5;
    border-radius: 8px;
    padding: 1rem 1.1rem;
    margin-bottom: 10px;
  }

  .brief-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #999;
    margin-bottom: 6px;
  }

  .brief-value {
    font-size: 14px;
    color: #1a1a1a;
    line-height: 1.6;
    font-weight: 500;
  }

  .brief-value.body { font-weight: 400; }

  .beat-list { list-style: none; }
  .beat-list li {
    display: flex;
    gap: 10px;
    font-size: 14px;
    color: #1a1a1a;
    line-height: 1.6;
    margin-bottom: 6px;
  }

  .beat-num {
    font-size: 11px;
    color: #999;
    min-width: 16px;
    padding-top: 2px;
    font-weight: 600;
  }

  .slides-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 8px;
  }

  .slide-card {
    background: #f9f8f5;
    border: 1px solid #e8e6e0;
    border-radius: 8px;
    padding: 0.75rem;
  }

  .slide-num {
    font-size: 10px;
    color: #aaa;
    margin-bottom: 5px;
  }

  .slide-head {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .slide-body {
    font-size: 12px;
    color: #666;
    line-height: 1.5;
  }

  .copy-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 1rem;
  }

  .copy-btn {
    padding: 6px 14px;
    font-size: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
    color: #555;
    cursor: pointer;
    transition: all 0.15s;
  }

  .copy-btn:hover { border-color: #999; color: #1a1a1a; }

  .footer {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    margin-top: 2rem;
  }
</style>
</head>
<body>

<div class="container">

  <header>
    <h1>Meta Ads Brief Generator</h1>
    <p>The100x.digital — 14 angles × 4 formats — ready for your designer</p>
  </header>

  <div class="card">
    <p class="section-title">Campaign details</p>
    <div class="fields">
      <div>
        <label>Client</label>
        <select id="clientSel">
          <option value="">Select client</option>
          <option value="Amppa Skin & Hair Clinic|skin & hair, LHR, acne, pigmentation, Mogappair Chennai">Amppa Skin & Hair</option>
          <option value="Shine Family Clinic & Dental|pediatric care, general dentistry, Perumbakkam Chennai">Shine Family Clinic</option>
          <option value="The Golden Gem Cosmetic Clinic|cosmetic skin treatments, Chennai">Golden Gem Cosmetic</option>
          <option value="Maneesh Dentistry|GFC hair treatment, Hydrafacial, Chemical Peel">Maneesh Dentistry</option>
          <option value="Aura Dentistry|Invisalign, dental aesthetics, smile design">Aura Dentistry</option>
          <option value="MS Dental Care|Invisalign, Braces, orthodontics">MS Dental Care</option>
        </select>
      </div>
      <div>
        <label>Treatment / offer</label>
        <input type="text" id="treatInput" placeholder="e.g. Laser Hair Removal">
      </div>
      <div>
        <label>Campaign goal</label>
        <select id="goalSel">
          <option value="">Select goal</option>
          <option>Lead Generation</option>
          <option>Appointment Booking</option>
          <option>Brand Awareness</option>
          <option>Offer Promotion</option>
          <option>Re-engagement</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <p class="section-title">Ad angle</p>
    <div class="legend">
      <span class="legend-item"><span class="dot dot-green"></span>Fully AI-generatable</span>
      <span class="legend-item"><span class="dot dot-amber"></span>Needs stock footage</span>
    </div>
    <div class="angles" id="angleWrap"></div>
  </div>

  <button class="gen-btn" id="genBtn">Generate brief</button>
  <div class="error" id="errMsg"></div>
  <div class="loading" id="loadDiv">Writing your brief — this takes about 10 seconds...</div>

  <div class="result card" id="resultDiv">
    <div class="result-header">
      <div class="result-meta">
        <h2 id="rTitle"></h2>
        <p id="rMeta"></p>
      </div>
      <span class="client-tag" id="clientTag"></span>
    </div>
    <div class="fmt-tabs" id="fmtTabs"></div>
    <div id="briefContent"></div>
    <div class="copy-row">
      <button class="copy-btn" id="copyBtn">Copy brief</button>
    </div>
  </div>

  <p class="footer">The100x.digital · Powered by Claude</p>

</div>

<script>
const ANGLES = [
  {name:"Headline Ad",stock:false},
  {name:"Problem–Solution",stock:false},
  {name:"Comparison",stock:false},
  {name:"Listicle",stock:false},
  {name:"Hook-Only / Pattern Interrupt",stock:false},
  {name:"Offer-Based Ad",stock:false},
  {name:"Educational / Value-First",stock:false},
  {name:"Myth-Busting / Contrarian",stock:false},
  {name:"Meme / Trend-Based",stock:false},
  {name:"FAQ / Objection Handling",stock:false},
  {name:"Us vs Them / Positioning",stock:false},
  {name:"POV / Relatable Scenario",stock:true},
  {name:"Story-Based",stock:true},
  {name:"Lifestyle Integration",stock:true},
];
const FMTS = {reels:"Reels",carousel:"Carousel",static:"Static image",story:"Story"};
let selAngle = 0, selFmt = "reels", briefData = null;

function buildAngles() {
  const w = document.getElementById("angleWrap"); w.innerHTML = "";
  ANGLES.forEach((a, i) => {
    const b = document.createElement("button");
    b.className = "angle-btn" + (i === selAngle ? " active" : "");
    b.innerHTML = `<span class="dot ${a.stock ? "dot-amber" : "dot-green"}"></span>${a.name}`;
    b.onclick = () => { selAngle = i; buildAngles(); };
    w.appendChild(b);
  });
}

function buildFmtTabs() {
  const w = document.getElementById("fmtTabs"); w.innerHTML = "";
  Object.entries(FMTS).forEach(([k, v]) => {
    const b = document.createElement("button");
    b.className = "fmt-tab" + (k === selFmt ? " active" : "");
    b.textContent = v;
    b.onclick = () => { selFmt = k; buildFmtTabs(); renderBrief(); };
    w.appendChild(b);
  });
}

function renderBrief() {
  if (!briefData) return;
  const fmt = briefData[selFmt];
  if (!fmt) return;
  document.getElementById("rTitle").textContent = ANGLES[selAngle].name + " — " + FMTS[selFmt];
  const c = document.getElementById("briefContent");

  if (selFmt === "reels") {
    let h = `<div class="brief-block"><p class="brief-label">Hook</p><p class="brief-value">${fmt.hook}</p></div>`;
    h += `<p class="brief-label" style="margin:4px 0 8px;padding-left:2px">Script outline</p><ul class="beat-list">`;
    (fmt.scriptOutline||[]).forEach((b,i) => { h += `<li><span class="beat-num">${i+1}</span><span>${b}</span></li>`; });
    h += `</ul>`; c.innerHTML = h;
  } else if (selFmt === "carousel") {
    let h = `<div class="slides-grid">`;
    (fmt.slides||[]).forEach((s,i) => {
      h += `<div class="slide-card"><p class="slide-num">Slide ${i+1}</p><p class="slide-head">${s.headline}</p><p class="slide-body">${s.body}</p></div>`;
    });
    c.innerHTML = h + `</div>`;
  } else if (selFmt === "static") {
    c.innerHTML = `<div class="brief-block"><p class="brief-label">Headline</p><p class="brief-value">${fmt.headline}</p></div><div class="brief-block"><p class="brief-label">Primary text</p><p class="brief-value body">${fmt.primaryText}</p></div><div class="brief-block"><p class="brief-label">CTA</p><p class="brief-value">${fmt.cta}</p></div>`;
  } else if (selFmt === "story") {
    c.innerHTML = `<div class="brief-block"><p class="brief-label">CTA — lead with this</p><p class="brief-value">${fmt.cta}</p></div><div class="brief-block"><p class="brief-label">Visual direction</p><p class="brief-value body">${fmt.visual}</p></div><div class="brief-block"><p class="brief-label">Copy</p><p class="brief-value body">${fmt.copy}</p></div>`;
  }
}

function getCopyText() {
  if (!briefData) return "";
  const fmt = briefData[selFmt];
  if (!fmt) return "";
  let t = `${ANGLES[selAngle].name} — ${FMTS[selFmt]}\n\n`;
  if (selFmt === "reels") { t += `Hook: ${fmt.hook}\n\nScript:\n`; (fmt.scriptOutline||[]).forEach((b,i) => { t += `${i+1}. ${b}\n`; }); }
  else if (selFmt === "carousel") { (fmt.slides||[]).forEach((s,i) => { t += `Slide ${i+1}: ${s.headline} — ${s.body}\n`; }); }
  else if (selFmt === "static") { t += `Headline: ${fmt.headline}\nPrimary text: ${fmt.primaryText}\nCTA: ${fmt.cta}`; }
  else if (selFmt === "story") { t += `CTA: ${fmt.cta}\nVisual: ${fmt.visual}\nCopy: ${fmt.copy}`; }
  return t;
}

document.getElementById("copyBtn").onclick = () => {
  const t = getCopyText(); if (!t) return;
  navigator.clipboard.writeText(t).then(() => {
    const b = document.getElementById("copyBtn");
    b.textContent = "Copied!";
    setTimeout(() => { b.textContent = "Copy brief"; }, 2000);
  });
};

document.getElementById("genBtn").onclick = async () => {
  const clientRaw = document.getElementById("clientSel").value;
  const treatment = document.getElementById("treatInput").value.trim();
  const goal = document.getElementById("goalSel").value;
  const err = document.getElementById("errMsg");

  err.style.display = "none";
  if (!clientRaw || !treatment || !goal) {
    err.textContent = "Please fill in all three fields before generating.";
    err.style.display = "block"; return;
  }

  const [clientName, clientFocus] = clientRaw.split("|");
  const angle = ANGLES[selAngle];
  const stockNote = angle.stock ? " This angle needs stock footage — include clear visual direction for the designer." : "";

  document.getElementById("clientTag").textContent = clientName;
  document.getElementById("rMeta").textContent = `${treatment} · ${goal} · ${new Date().toLocaleDateString("en-IN",{month:"long",year:"numeric"})}`;
  document.getElementById("loadDiv").style.display = "block";
  document.getElementById("resultDiv").style.display = "none";
  document.getElementById("genBtn").disabled = true;
  document.getElementById("genBtn").textContent = "Generating...";

  const prompt = `You are a Meta Ads creative strategist for aesthetic and dental clinics in Tamil Nadu, India. Write punchy Tanglish copy that sounds like a real Chennai/Coimbatore patient — not generic AI copy.

Client: ${clientName} (${clientFocus})
Treatment: ${treatment}
Goal: ${goal}
Angle: ${angle.name}${stockNote}

Write 4 format briefs. Keep copy SHORT and punchy.

1. reels: hook (1 scroll-stopping line) + scriptOutline (exactly 4 beats, 8-12 words each)
2. carousel: exactly 5 slides, each with headline and body (1 line)
3. static: headline (6-10 words), primaryText (max 2 sentences), cta (4-6 words)
4. story: cta (action-first, 4-6 words), visual (1 sentence), copy (1-2 lines)

Respond with ONLY a raw JSON object. No markdown, no explanation. Start with { end with }.

{"reels":{"hook":"...","scriptOutline":["...","...","...","..."]},"carousel":{"slides":[{"headline":"...","body":"..."},{"headline":"...","body":"..."},{"headline":"...","body":"..."},{"headline":"...","body":"..."},{"headline":"...","body":"..."}]},"static":{"headline":"...","primaryText":"...","cta":"..."},"story":{"cta":"...","visual":"...","copy":"..."}}`;

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = "Error: " + (data.error || "Something went wrong."); err.style.display = "block"; return; }
    const rawText = data.content.filter(b => b.type === "text").map(b => b.text).join("").trim();
    const jsonStart = rawText.indexOf("{");
    const jsonEnd = rawText.lastIndexOf("}");
    if (jsonStart === -1 || jsonEnd === -1) { err.textContent = "Could not parse response. Please try again."; err.style.display = "block"; return; }
    briefData = JSON.parse(rawText.slice(jsonStart, jsonEnd + 1));
    selFmt = "reels";
    buildFmtTabs(); renderBrief();
    document.getElementById("resultDiv").style.display = "block";
  } catch (e) {
    err.textContent = "Error: " + e.message;
    err.style.display = "block";
  } finally {
    document.getElementById("loadDiv").style.display = "none";
    document.getElementById("genBtn").disabled = false;
    document.getElementById("genBtn").textContent = "Generate brief";
  }
};

buildAngles();
</script>
</body>
</html>
